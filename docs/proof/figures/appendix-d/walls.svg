<svg xmlns="http://www.w3.org/2000/svg" width="896" height="424" viewBox="0 0 896 424" role="img" aria-label="Left: the angles (s, d) of a missing south wing; the wall of Lemma 9.42 excludes s &lt;= d - pi/4 (grey); the dashed lines s = 0, 2/5 and 12/25 bound the angles of S on its own axis and on the south side of C and split Propositions D.11 and D.12. Right: the angles (v, d) of a missing west wing with W on its own axis: the wall v &lt;= pi/4 - d (grey), the gap d + v &lt;= 1 of Lemma D.5 (yellow), and the four parts of Proposition D.7 exclude everything but the small green domain of section D.9, with the three points of Lemma D.18 marked">
