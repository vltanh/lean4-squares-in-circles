<svg xmlns="http://www.w3.org/2000/svg" width="866" height="391" viewBox="0 0 866 391" role="img" aria-label="Seven horizontal bars over the axis of d, one for each of Propositions D.10, D.11, D.12, D.14, D.15, D.17, and D.19 with D.20: each grey bar is the range of d on which the proposition is proved, a blue part inside it the range used for normalized packings, d in (1/2, pi/4] or (16/25, pi/4], and for Propositions D.14 and D.17 an orange part, d in [pi/4, pi/2 - 3/5) or [pi/4, pi/2 - 16/25), the range used for the reflections of missing west wings; the upper ends 34/35 and 163/175 lie just beyond pi/2 - 3/5 and pi/2 - 16/25">
