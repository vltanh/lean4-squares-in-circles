<svg xmlns="http://www.w3.org/2000/svg" width="876" height="341" viewBox="0 0 876 341" role="img" aria-label="Three graphs. (1) Over x from 0 to 12/25, the wing harmonic, in blue, concave and above the dashed orange line mu- + 4x/9, which it meets at 0. (2) Over r from 0 to 1, the second derivative of J, in blue, falling from about 0.45 to about -0.02, below the dashed orange line mu+ - 1/6 - r/3, which it meets at 0. (3) Over d from 1/2 to 163/175, cos d + sin d, in blue, a concave arch with its top at pi/4, above the dashed orange level 4/3">
