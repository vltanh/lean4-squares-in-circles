<svg xmlns="http://www.w3.org/2000/svg" width="391" height="418" viewBox="0 0 391 418" role="img" aria-label="The squares C, W, D and S of a missing west wing with W on its own axis, at v = 0.55, s = 0.1, d = 0.55, in the smallest disk that allows these separations (radius 1.698, pink; the circle of radius R0 is dashed). In colour, the separating lines of the stress of Lemma D.6: of W and of D from C along their own axes, and of W and D along the secondary axis of D; in grey, the other separations. Orange arrows show the forces on C, W and D for the weights 13/6, 12/5 and 1; there is no force on S">
