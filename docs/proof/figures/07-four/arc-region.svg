<svg xmlns="http://www.w3.org/2000/svg" width="516" height="380" viewBox="0 0 516 380" role="img" aria-label="The (a, b)-plane right of a = 1/2: the orange quadrilateral where the cap of an exterior square on the circle of radius 1/2 is at least a quarter circle, bounded by the dashed line a = (2 + root 2)/4, where A = pi/4, and the line a + b = 1, where A + V = pi/2; the blue part of the disk where phi is at most 2 lies inside it and meets the line a + b = 1 only at (1/2, 1/2), while the point (0.9, 0.05) lies below the line a + b = 1 but right of the dashed line">
