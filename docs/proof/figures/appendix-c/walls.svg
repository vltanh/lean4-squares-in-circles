<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Two panels in the plane of the angles. (a) d from 1/2 to pi over 4 against w in its window from minus 2/3 to 5/8: the wall w = d minus pi over 4 runs from about (1/2, -0.29) to the model point (pi over 4, 0); W and D can be separated along the secondary axis of D only below it, in the shaded region. (b) The same for s, with the wall s = d minus pi over 4: D and S can be separated along the secondary axis of D only above it">
