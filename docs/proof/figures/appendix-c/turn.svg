<svg xmlns="http://www.w3.org/2000/svg" width="738" height="390" viewBox="0 0 738 390" role="img" aria-label="Two panels with the central square C, the line of its west side (dashed, vertical) and the line through a corner of C perpendicular to the own axis of W, across which W is separated along its own axis (blue, dashed); W is drawn at the corner position, where both margins vanish, and slid along its own line to where it is separated along its own axis but not along the west side. In (a), with w negative, W slides upwards, away from the pin of D; in (b), with w positive, it slides downwards, towards the pin of D and across the dotted purple line beyond which D lies">
