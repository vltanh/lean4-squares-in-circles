<svg xmlns="http://www.w3.org/2000/svg" width="400" height="330" viewBox="0 0 400 330" role="img" aria-label="The plane of a + 1/2 against |b| + 1/2, where the charts in the ceiling have their far corners inside the dashed circle of radius R0 (shaded). An orange vertical line a + 1/2 = L and a dashed orange horizontal line |b| + 1/2 = T + 1/2 for D at d = 1/2 meet just outside the circle, so the part of the shaded region right of the vertical line lies below the horizontal one. A purple curve, the meeting point for d from 1/2 to pi over 4, runs just outside the circle and nearly touches it at both ends">
