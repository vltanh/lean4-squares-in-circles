<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-label="Two panels in the plane of the angles w and d, each with the window of the angles (dashed) and the band d above 1/2 shaded. (a) The rectangle of the stress with W on its own axis, w from minus 2/3 to 0 and d from 0 to 1/2; (b) the domain of the stress with W on the west side, w from minus 2/5 to 2/5, d from 0 to 1/2 and w at most d, split at w = 0. At each vertex the lower bounds of the slack for the two separators of W and D are written, the upper one for the secondary axis of W and the lower one for that of D">
