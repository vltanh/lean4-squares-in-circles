<svg xmlns="http://www.w3.org/2000/svg" width="402" height="402" viewBox="0 0 402 402" role="img" aria-label="The (a, b)-plane: the disk where phi is at most one half, centred at (-1/2, -1/2), lies on one side of the line a plus b equals 0 and touches it at the origin, the only point it shares with the quadrant where a and b are at least 0">
<title>The (a, b)-plane: the disk where phi is at most one half, centred at (-1/2, -1/2), lies on one side of the line a plus b equals 0 and touches it at the origin, the only point it shares with the quadrant where a and b are at least 0</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<polygon points="239.0,162.5 375.0,162.5 375.0,26.5 239.0,26.5" fill="#ffedd5" stroke="none" stroke-width="1.5" fill-opacity="1"/>
<circle cx="154.0" cy="247.5" r="120.2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<line x1="375.0" y1="298.5" x2="103.0" y2="26.5" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="26.5" y1="162.5" x2="380.1" y2="162.5" stroke="#1f2937" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="239.0" y1="375.0" x2="239.0" y2="21.4" stroke="#1f2937" stroke-width="1" marker-end="url(#arrow)"/>
<text x="378.4" y="174.4" font-size="15" font-family="Georgia, 'Times New Roman', serif" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-style="italic">a</text>
<text x="227.1" y="26.5" font-size="15" font-family="Georgia, 'Times New Roman', serif" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-style="italic">b</text>
<circle cx="239.0" cy="162.5" r="4.2" fill="#1f2937"/>
<text x="256.0" y="148.9" font-size="14" font-family="Georgia, 'Times New Roman', serif" fill="#1f2937" text-anchor="start" dominant-baseline="middle">(0, 0)</text>
<circle cx="154.0" cy="247.5" r="3.2" fill="#2563eb"/>
<text x="160.8" y="261.1" font-size="13" font-family="Georgia, 'Times New Roman', serif" fill="#2563eb" text-anchor="start" dominant-baseline="middle">(−½, −½)</text>
<text x="133.6" y="210.1" font-size="16" font-family="Georgia, 'Times New Roman', serif" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-style="italic">φ ≤ ½</text>
<text x="313.8" y="84.3" font-size="15" font-family="Georgia, 'Times New Roman', serif" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-style="italic">a, b ≥ 0</text>
<text x="126.8" y="36.7" font-size="14" font-family="Georgia, 'Times New Roman', serif" fill="#1f2937" text-anchor="start" dominant-baseline="middle">a + b = 0</text>
</svg>
