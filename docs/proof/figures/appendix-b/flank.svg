<svg xmlns="http://www.w3.org/2000/svg" width="722" height="428" viewBox="0 0 722 428" role="img" aria-label="Two panels with the arc of the circle of radius R0 and the dotted circle of radius 9/10 through the pins p_W and p_D. Left: a square T at the phase pi - 0.5, separated from C = Q(c0, 0) along its own axis by the dashed line, pushed sideways as far as the disk allows; it holds p_W. Dashed purple, the same square moved across until it just misses p_W: its far vertex, marked, lies outside the circle. Right: a square T at the phase pi - 0.3 beyond the dashed line x = -eta of the west side of C; it holds p_W">
