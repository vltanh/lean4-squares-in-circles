<svg xmlns="http://www.w3.org/2000/svg" width="609" height="373" viewBox="0 0 609 373" role="img" aria-label="The directions pi + v around the west side of o, for v from -pi/4 to pi/4, cut into four coloured sectors at v = -2/3, -pi/12 and 5/8, with the pins p_W and p_D on the dotted circle of radius 9/10. A legend reads: v at most -2/3, none (Lemma B.11); v at most -pi/12, the square holds p_W (Lemma B.14); v below 5/8, it holds p_W or p_D (Lemma 9.19); v at least 5/8, it holds p_D (Lemmas 9.19 and B.15)">
