<svg xmlns="http://www.w3.org/2000/svg" width="769" height="414" viewBox="0 0 769 414" role="img" aria-label="Two panels, regimes (i) and (ii) of Lemma 9.14. In each, the containing square C near the origin o, the dashed circle of radius rho0 - 1/2, the dotted circle of radius 9/10 with the free arc in green, and the green rectangle of the points q allowed by the lemma. Thin lines are the support lines of C at distance at most rho0 - 1/2 from o: grey ones with a normal pointing west pass west of the rectangle; in regime (i) blue ones with a normal in the first quadrant pass above it and orange ones with a normal in the fourth quadrant below it; in regime (ii) only orange lines, nearly horizontal, remain below it">
