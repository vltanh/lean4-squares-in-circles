<svg xmlns="http://www.w3.org/2000/svg" width="872" height="484" viewBox="0 0 872 484" role="img" aria-label="The region of the angles (t, u) with -2/3 at most t, t at most u, and u between -2/5 and 2/5, cut by the lines u = 0 and t = 0 into three parts, shaded differently: u negative, t negative and u positive, and t positive. The seven vertices v1 to v7 of the parts are marked, each labelled with the values of the two west stresses there, Phi_W first and Phi_D second, all positive; dotted horizontal segments inside the parts indicate the directions in which the stresses are concave">
