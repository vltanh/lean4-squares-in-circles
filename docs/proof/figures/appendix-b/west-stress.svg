<svg xmlns="http://www.w3.org/2000/svg" width="533" height="564" viewBox="0 0 533 564" role="img" aria-label="The containing square C, grey, the square W, orange, turned by -0.3 from the west and separated from C along its own axis, and the square D, blue, turned by 0.1 and separated from C along the west side of C and from W along the secondary axis of W; the three separating lines are dashed and labelled with their weights 9/20, 3/10 and 1/4. Thick arrows are the forces F_C, F_W and F_D of the west stress. With every separation tight and W moved to the best place, two vertices, marked, still lie outside the circle of radius R0; the dashed circle through the farthest has radius about 1.80">
