<svg xmlns="http://www.w3.org/2000/svg" width="711" height="346" viewBox="0 0 711 346" role="img" aria-label="Left: from o, a constant vector of length a = 2/5 and, from its tip, a vector of length b = 1 turned by the angle x; the tip of their sum runs on the dashed circle of radius b, and its distance L from o is drawn thick. The part of the circle behind the dotted line through o perpendicular to the constant vector is orange. Right: L as a function of x on minus pi to pi, between b - a and a + b, with its peak touched from below by a dashed green parabola, and orange where L is at most the square root of b squared minus a squared">
