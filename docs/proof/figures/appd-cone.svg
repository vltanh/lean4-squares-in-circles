<svg xmlns="http://www.w3.org/2000/svg" width="716" height="366" viewBox="0 0 716 366" role="img" aria-label="Left: the plane of forces. For turns z from 0 to pi/6 the force (cos z, 1 - sin z) splits into mu(9, 11), taken up by the tie line, and a residual force (U, V) that stays in the cone U/2 at most V at most 3U/5. Right: the margin of the bound UX + VY at most 13U/8 + 4V/5 against the slope r = V/U, a concave quadratic positive on the cone">
