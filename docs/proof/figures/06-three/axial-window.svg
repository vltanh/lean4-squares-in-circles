<text x="109.0" y="525.0" font-size="12" font-family="Georgia, 'Times New Roman', serif" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">½</text>
<line x1="239.0" y1="504.2" x2="239.0" y2="493.8" stroke="#1f2937" stroke-width="1"/>
<text x="239.0" y="525.0" font-size="12" font-family="Georgia, 'Times New Roman', serif" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">0.6</text>
