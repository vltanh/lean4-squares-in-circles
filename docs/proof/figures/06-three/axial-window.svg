<svg xmlns="http://www.w3.org/2000/svg" width="446" height="588" viewBox="0 0 446 588" role="img" aria-label="The part of P3 with a at least 1/2 in the (a, b)-plane; right of the line where the full cap has half-width 5 pi/12 - 13/58 only a small triangle at the type A point remains, below the line b = 1/16">
