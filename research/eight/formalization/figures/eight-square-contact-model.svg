    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>The geometric equality model for eight unit squares</dc:title>
    <dc:description>Five fixed exterior anchors A, B, D, E, H; two exterior contact-line sliders T and G; central square C. Five corner contacts define the fixed circle. Coordinates are approximate and are illustrative only.</dc:description>
