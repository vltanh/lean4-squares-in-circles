name: Lean build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, audit axioms, run checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the pinned toolchain, fetches the mathlib cache, runs
      # `lake build`, and fails if any declaration under `SquaresInCircles`
      # depends on an axiom other than propext, Classical.choice, Quot.sound.
      - uses: leanprover/lean-action@v1
        with:
          axiom-audit: true
      - name: Axiom audit and sanity checks
        run: |
          lake env lean AxiomAudit.lean
          lake env lean SanityChecks.lean
      # `lake comparator` sandboxes its build with bubblewrap, which needs
      # unprivileged user namespaces; Ubuntu 24.04 restricts them by default.
      - name: Install bubblewrap for lake comparator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check the proofs against Challenge.lean
        run: scripts/verify-comparator.sh
