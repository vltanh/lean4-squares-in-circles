# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Metadata for the Palomar registry, in the formalization.yaml v0.4 format
# (https://github.com/mathlib-initiative/formalization.yaml). The statement is
# Challenge.lean; the Comparator configuration is comparator.json.
version: "v0.4"

project:
  name: "Optimal packings of one through seven unit squares in a disk"
  description: >-
    For every n = 1, …, 7, this formalization identifies the least radius of a
    closed disk containing n freely rotated unit squares with disjoint
    interiors, and classifies every packing that attains that radius. Cases
    1 through 6 have one optimal model up to rotation about the disk centre and
    relabelling; case 7 is the three-parameter column family. The six-square
    case proves exact optimality and uniqueness for the algebraic model defined
    in Challenge.lean, whose model contains one genuinely rotated square.
    Earlier sources supplied exact or approximate results for several smaller
    cases and best-known constructions for six and seven; the repository
    records those relationships explicitly below.
  # People only; AI contributions are recorded under automation.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.MG"]
  msc2020: ["52C15"]

sources:
  - title: "Squares in Circles"
    authors:
      - "Erich Friedman"
    id: "https://erich-friedman.github.io/packing/squincir/"
    type: "other"
    location: >-
      Entries n = 1 to 7, as archived on 2026-07-23:
      https://web.archive.org/web/20260723054450/https://erich-friedman.github.io/packing/squincir/
    relationship: "background"
    note: >-
      The standard record of the best known packings, and the source of the
      candidate configurations proved optimal here. On 2026-07-23 it listed
      one and two squares as trivial, four as proved at the International Math
      Summer Camp in 2026, and numerical best-known configurations for the
      remaining small cases, including six. It is background for the
      six-square candidate, not an independently verified exact optimality or
      uniqueness proof for that case.
  - title: "Optimal packings of one and two unit squares in a circle"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Listed as trivial on Friedman's page, with no reference. The
      formalization proves both radii and the uniqueness of both packings.
  - title: "Rigorous packing of unit squares into a circle"
    authors:
      - "Tiago Montanher"
      - "Arnold Neumaier"
      - "Mihály Csaba Markót"
      - "Ferenc Domes"
      - "Hermann Schichl"
    id: "doi:10.1007/s10898-018-0711-5"
    type: "paper"
    location: "J. Global Optim. 73 (2019), no. 3, 547–565; Theorem 2 and Table 6"
    relationship: "independently-proves"
    note: >-
      Reports solving three squares by computer-assisted interval branch and
      bound: Theorem 2 encloses the radius in [1.28847050800547,
      1.28847050800553], which contains 5√17/16, and every optimal arrangement
      in one of four boxes of width at most 6.23·10⁻¹³ near the T. It trusts
      the search code and interval rounding, and gives neither the exact radius
      nor exact uniqueness. The formalization proves both by a different
      argument and uses neither their computation nor their method.
  - title: >-
      The 4th International Mathematics Summer Camp (IMSC 2026), Marking
      Schemes and Solutions, Day 2, Problem 6
    type: "other"
    location: "Day 2, Problem 6, July 2026"
    relationship: "independently-proves"
    note: >-
      Poses four squares, as the largest side (√2/2) of four congruent squares
      in a unit disk, with an official solution by hand. It is not public and
      we have not seen it; this account follows Friedman's page, which lists
      the case as proved at the camp, and Zhao's note below, by which the
      solution uses a concentric auxiliary circle, proves the radius and does
      not discuss uniqueness. The formalization does not use it.
  - title: "Four congruent squares in a unit disk: an elementary proof that s_max = √2/2"
    authors:
      - "Wei Zhao"
    contributors:
      - name: "Erich Friedman"
        role: "shared the note with us in private correspondence"
    type: "other"
    location: "Theorem 1 (the radius) and Proposition 1 (uniqueness); dated 6 July 2026"
    relationship: "other"
    note: >-
      Proves by hand that four unit squares fit in no disk of radius less than
      √2, and that the 2 × 2 block is then the only packing up to rotation, by
      the arcs the squares hold on the concentric circle of radius half a side:
      each holds at least a quarter, and exactly a quarter only when the disk
      centre is one of its vertices. The proof here rests on the same idea and
      was written without the note, but the relationship is other, not
      independently-proves, because both came from work with Claude: the note
      says so, and the arc idea here came from Claude Opus 5. We know of no
      public copy.

related_formalizations:
  - id: "https://github.com/vltanh/lean4-squares-in-circles/tree/dba4c44d83821eba7f982e7622fc93b794ca1264"
    relationship: "supersedes"
    note: >-
      The first version of this repository, on its legacy branch: a Lean proof
      of the three-square lower bound by separating axes, 48 branches and 53
      rational certificates, replaced by the present proofs, which do not use
      it. We found no other formalization of an optimal packing of squares or
      circles in a circle or a square.

status:
  scope: >-
    The least radius and all optimal packings of n unit squares in a disk for
    every n = 1, …, 7, stated by the two theorems of Challenge.lean,
    optimal_radius and optimal_packings. For n = 1, …, 6 the optimal model is
    unique up to the stated congruence; for n = 7 the complete column family is
    characterized. No theorem is claimed here for n ≥ 8.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "SquaresInCircles.optimal_radius"
      file: "SquaresInCircles.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "SquaresInCircles.optimal_packings"
      file: "SquaresInCircles.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["ChatGPT 6 Pro"]
      framework: "ChatGPT"
      tool_setup: >-
        ChatGPT with its built-in tools, which can run code, prompted by the
        repository owner; it never compiled its Lean code. It wrote the
        complete proofs, mathematics and Lean, of three, four, five and seven
        squares, which Claude then compiled and modified: a first certificate
        proof of three squares; the occupied-arc proofs, on an idea of Claude
        Opus 5, written first for five squares and then, on request,
        generalized to three and four in one framework; their uniqueness
        proofs; and the optimality and classification proofs of seven squares.
        They reached the repository as pull requests #2 to #5 and commits
        co-authored by ChatGPT.
    - method: "agent"
      models: ["Claude Opus 5", "Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        A coding agent with a Lean toolchain, at high to maximum effort. It
        compiled ChatGPT's proofs, repairing and modifying them until Lean
        accepted them, and integrated them into the library; proposed the
        occupied-arc idea (Claude Opus 5); wrote the proofs of one and two
        squares; reorganized, reviewed and simplified the library; wrote the
        documentation and its figures; and prepared this submission.
    - method: "agent"
      models: ["GPT-5.6 Sol"]
      framework: "ChatGPT"
      tool_setup: >-
        Used through ChatGPT with GitHub repository tools to develop and review
        the six-square Lean proof and its exact algebraic reductions. An earlier
        self-contained route used exact internal Lean finite classification;
        the current public endpoint instead uses the table-free analytical
        `Analytic.CompleteReduction` route. External Python or numerical-script
        success is not a theorem premise. This session did not itself run the
        deferred Lean/Comparator build or final axiom/dependency audit.
  notes: >-
    The development is AI-assisted and directed by the repository owner.
    Earlier cases were developed with ChatGPT and Claude as recorded in
    docs/contributors.md and the commit history. GPT-5.6 Sol was additionally
    used for the n=6 continuation on this branch. External research scripts and
    audit logs may exist in the repository, but the submitted Lean theorem must
    not depend on their success; Palomar's final mechanical verification of the
    pinned commit remains authoritative.

fidelity:
  divergences: >-
    The formal statement is stronger than several cited sources. In particular,
    the six-square background source supplies a best-known construction rather
    than an exact optimality-and-uniqueness theorem; this formalization claims
    and proves the exact six-square result stated in Challenge.lean. For three
    squares Montanher et al. give numerical enclosures rather than the exact
    radius and exact uniqueness proved here. Congruence is the unchanged
    point-set notion in Challenge.lean: one rotation about the disk centre and
    a relabelling; reflection is not built into the definition.

review:
  status: "self-assessed"
  reviewers: ["The-Anh Vu-Le"]
  notes: >-
    The repository owner reviewed the statement surface and documentation. The
    mathematics has had no independent human review. This metadata does not
    claim that the current n=6 branch has already passed Lean compilation,
    Comparator, NanoDa replay, or Palomar verification; those are mechanical
    submission gates to be run on the final pinned commit.

alignment:
  namespace: "SquaresInCircles"
  statements:
    - source: "The least radius of a disk that holds n unit squares, for every n = 1 through 7"
      lean: "SquaresInCircles.optimal_radius"
      module: "SquaresInCircles"
      status: "proved"
    - source: "The packings of that radius are exactly the optimal models, turned and relabelled"
      lean: "SquaresInCircles.optimal_packings"
      module: "SquaresInCircles"
      status: "proved"

acknowledgements: >-
  Mathlib, and the Lean toolchain with its lake comparator. The pictures of the
  optimal packings in the README are Erich Friedman's.
