# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Metadata for the Palomar registry, in the formalization.yaml v0.4 format
# (https://github.com/mathlib-initiative/formalization.yaml). The statement is
# Challenge.lean; the Comparator configuration is comparator.json.
version: "v0.4"

project:
  name: "Optimal packings of one to seven unit squares in a disk"
  description: >-
    For n = 1, …, 7: the least radius of a closed disk holding n unit squares
    with disjoint interiors, each placed and rotated freely, and every packing
    that attains it. The radii are √2/2, √5/2, 5√17/16, √2, √(5/2), √q* ≈
    1.68854 and √13/2, where q* is a quartic irrational. Up to rotation about
    the disk centre and relabelling, the optimal packing is unique for n ≤ 6:
    the square, the 2 × 1 rectangle, the T, the 2 × 2 block, the plus, and for
    six squares a central square with four neighbours, two of them pushed
    along its sides, and a sixth square turned by π/4 between those two. For
    n = 7 the optimal packings form a three-parameter family: two columns of
    two squares and, between them, a column of three whose heights vary
    independently, at least 1 apart and within √3 − 1/2 of the disk centre.
    The proofs for three to five squares bound the arcs the squares occupy on
    a small circle about the disk centre; for seven squares, each square
    avoiding the disk centre gets a direction from it, and in the optimal disk
    two disjoint such squares get directions at least π/3 apart. Six squares
    build on that: one square contains the disk centre, five fixed points
    label the others, and a weighted sum of separating inequalities, with
    estimates uniform in the angles of the squares, forces the optimal
    radius. We found no earlier proof for five, six or seven squares, and no
    exact one for three, where a computer-assisted enclosure of the radius and
    the optimal arrangements was known. Four squares, uniqueness included,
    were settled by hand in 2026, by the same idea as here.
  # People only; AI contributions are recorded under automation.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.MG"]
  msc2020: ["52C15"]

sources:
  - title: "Squares in Circles"
    authors:
      - "Erich Friedman"
    id: "https://erich-friedman.github.io/packing/squincir/"
    type: "web page"
    location: >-
      Entries n = 1 to 7, as archived on 2026-07-23:
      https://web.archive.org/web/20260723054450/https://erich-friedman.github.io/packing/squincir/
    relationship: "background"
    note: >-
      The standard record of the best known packings, and the source of the
      radii and packings proved optimal here. On 2026-07-23 it listed one and
      two squares as trivial, four as proved at the International Math Summer
      Camp in 2026, and three, five and seven as found by Friedman in 1997,
      that is, as the best known. On 2026-09-30 it listed six squares as found
      by Friedman in 1997, with an exact radius found by David Ellsworth in
      2023, which agrees with the radius here.
  - title: "Optimal packings of one and two unit squares in a circle"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Listed as trivial on Friedman's page, with no reference. The
      formalization proves both radii and the uniqueness of both packings.
  - title: "Rigorous packing of unit squares into a circle"
    authors:
      - "Tiago Montanher"
      - "Arnold Neumaier"
      - "Mihály Csaba Markót"
      - "Ferenc Domes"
      - "Hermann Schichl"
    id: "doi:10.1007/s10898-018-0711-5"
    type: "paper"
    location: "J. Global Optim. 73 (2019), no. 3, 547–565; Theorem 2 and Table 6"
    relationship: "independently-proves"
    note: >-
      Reports solving three squares by computer-assisted interval branch and
      bound: Theorem 2 encloses the radius in [1.28847050800547,
      1.28847050800553], which contains 5√17/16, and every optimal arrangement
      in one of four boxes of width at most 6.23·10⁻¹³ near the T. It trusts
      the search code and interval rounding, and gives neither the exact radius
      nor exact uniqueness. The formalization proves both by a different
      argument and uses neither their computation nor their method.
  - title: >-
      The 4th International Mathematics Summer Camp (IMSC 2026), Marking
      Schemes and Solutions, Day 2, Problem 6
    type: "competition solutions"
    location: "Day 2, Problem 6, July 2026"
    relationship: "independently-proves"
    note: >-
      Poses four squares, as the largest side (√2/2) of four congruent squares
      in a unit disk, with an official solution by hand. It is not public and
      we have not seen it; this account follows Friedman's page, which lists
      the case as proved at the camp, and Zhao's note below, by which the
      solution uses a concentric auxiliary circle, proves the radius and does
      not discuss uniqueness. The formalization does not use it.
  - title: "Four congruent squares in a unit disk: an elementary proof that s_max = √2/2"
    authors:
      - "Wei Zhao"
    contributors:
      - name: "Erich Friedman"
        role: "shared the note with us in private correspondence"
    type: "unpublished note"
    location: "Theorem 1 (the radius) and Proposition 1 (uniqueness); dated 6 July 2026"
    relationship: "other"
    note: >-
      Proves by hand that four unit squares fit in no disk of radius less than
      √2, and that the 2 × 2 block is then the only packing up to rotation, by
      the arcs the squares hold on the concentric circle of radius half a side:
      each holds at least a quarter, and exactly a quarter only when the disk
      centre is one of its vertices. The proof here rests on the same idea and
      was written without the note, but the relationship is other, not
      independently-proves, because both came from work with Claude: the note
      says so, and the arc idea here came from Claude Opus 5. We know of no
      public copy.

related_formalizations:
  - id: "https://github.com/vltanh/lean4-squares-in-circles/tree/dba4c44d83821eba7f982e7622fc93b794ca1264"
    relationship: "supersedes"
    note: >-
      The first version of this repository, on its legacy branch: a Lean proof
      of the three-square lower bound by separating axes, 48 branches and 53
      rational certificates, replaced by the present proofs, which do not use
      it. We found no other formalization of an optimal packing of squares or
      circles in a circle or a square.

status:
  scope: >-
    The least radius and all the optimal packings of n unit squares in a disk
    for n = 1, …, 7, stated by the two theorems of Challenge.lean,
    optimal_radius and optimal_packings. n ≥ 8 is not treated; for those n,
    optimalRadius and optimalPackings hold placeholders about which no theorem
    says anything.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "SquaresInCircles.optimal_radius"
      file: "SquaresInCircles.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "SquaresInCircles.optimal_packings"
      file: "SquaresInCircles.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["ChatGPT 6 Pro", "ChatGPT (its latest model, September 2026)"]
      framework: "ChatGPT"
      tool_setup: >-
        ChatGPT with its built-in tools, which can run code, prompted by the
        repository owner; it never compiled its Lean code. ChatGPT 6 Pro wrote
        the complete proofs, mathematics and Lean, of three, four, five and
        seven squares, which Claude then compiled and modified: a first
        certificate proof of three squares; the occupied-arc proofs, on an idea
        of Claude Opus 5, written first for five squares and then, on request,
        generalized to three and four in one framework; their uniqueness
        proofs; and the optimality and classification proofs of seven squares.
        They reached the repository as pull requests #2 to #5 and commits
        co-authored by ChatGPT. For six squares, ChatGPT's latest model
        proved the optimum together with Claude Opus 5.5 Max in the Claude
        chat, with numerical certificates (pull request #6), in which Claude
        wrote the normalization; ChatGPT 6 Pro then turned the certificates
        into the analytical proof formalized here and wrote the whole Lean
        proof (pull request #7).
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude"
      tool_setup: >-
        The Claude chat, at Max effort, prompted by the repository owner. For
        six squares it proved the optimum together with ChatGPT's latest
        model and wrote the certificate-style proof of the normalization in
        pull request #6, which ChatGPT 6 Pro turned into the analytical proof
        formalized here.
    - method: "agent"
      models: ["Claude Opus 5", "Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        A coding agent with a Lean toolchain, at high to maximum effort. It
        compiled ChatGPT's proofs, repairing and modifying them until Lean
        accepted them, and integrated them into the library; proposed the
        occupied-arc idea (Claude Opus 5); wrote the proofs of one and two
        squares; reorganized, reviewed and simplified the library; wrote the
        documentation and its figures; and prepared this submission.
  notes: >-
    ChatGPT 6 Pro wrote the proofs of three, four, five and seven squares in
    full, in mathematics and in Lean, without compiling them. For six squares,
    ChatGPT's latest model and Claude Opus 5.5 Max, both in chat, proved the
    optimum together with numerical certificates, Claude writing the
    normalization; ChatGPT 6 Pro turned this proof into an analytical one and
    wrote the Lean, without compiling it. Claude Opus 5 and 5.5, in Claude
    Code, compiled, repaired and modified all of these, and wrote the proofs
    of one and two squares. The repository owner directed and reviewed the
    work and decided its scope and naming. docs/contributors.md gives a dated
    account, and the commits name the models that co-authored them.

fidelity:
  divergences: >-
    None known. The statement is stronger than the sources' claims: the exact
    radius and exact uniqueness where Montanher et al. give enclosures, and
    uniqueness added to the radii and packings on Friedman's page. For seven
    squares the optimal packing is not unique, and the statement characterizes
    the whole family. Congruence allows a rotation about the disk centre and a
    relabelling; every optimal model is symmetric under a reflection, so
    reflections add nothing. Distances use the squared Euclidean length
    (Mathlib's norm on ℝ × ℝ is the maximum norm).

review:
  status: "self-assessed"
  reviewers: ["The-Anh Vu-Le"]
  notes: >-
    The repository owner reviewed the statement (SquaresInCircles/Geometry.lean,
    restated in Challenge.lean) and the documentation; the mathematics has had
    no independent human review. Lean's kernel checks every proof, and lake
    comparator also replays the two compared theorems through the NanoDa and
    con-ron kernels. That establishes the proofs, not that the statement says
    what the prose claims.

alignment:
  namespace: "SquaresInCircles"
  statements:
    - source: "The least radius of a disk that holds n unit squares, for n = 1 to 7"
      lean: "SquaresInCircles.optimal_radius"
      module: "SquaresInCircles"
      status: "proved"
    - source: "The packings of that radius are exactly the optimal models, turned and relabelled"
      lean: "SquaresInCircles.optimal_packings"
      module: "SquaresInCircles"
      status: "proved"

acknowledgements: >-
  Mathlib, and the Lean toolchain with its lake comparator. The pictures of the
  optimal packings in the README are Erich Friedman's.
